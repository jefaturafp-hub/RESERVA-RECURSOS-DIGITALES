<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva de Recursos Digitales - IES Francés de Aranda</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN para transpilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DOMAIN = "@iesfrancesdearanda.es";
    const TOTAL_PORTATILES_POR_CARRO = 22;

    const PERIODOS = [
      { id: 1, nombre: "1ª Hora", rango: "8:30 - 9:20" },
      { id: 2, nombre: "2ª Hora", rango: "9:25 - 10:15" },
      { id: 3, nombre: "3ª Hora", rango: "10:20 - 11:10" },
      { id: 'recreo', nombre: "Recreo", rango: "11:10 - 11:40", esRecreo: true },
      { id: 4, nombre: "4ª Hora", rango: "11:40 - 12:30" },
      { id: 5, nombre: "5ª Hora", rango: "12:35 - 13:25" },
      { id: 6, nombre: "6ª Hora", rango: "13:30 - 14:20" }
    ];

    const RECURSOS = {
      CARRO_1: { id: "carro_1", nombre: "Carro 1ª Planta", tipo: "laptop", max: TOTAL_PORTATILES_POR_CARRO, ubicacion: "Planta 1" },
      CARRO_2: { id: "carro_2", nombre: "Carro 2ª Planta", tipo: "laptop", max: TOTAL_PORTATILES_POR_CARRO, ubicacion: "Planta 2" },
      CARRO_UM: { id: "carro_um", nombre: "Carro Usos Múltiples", tipo: "laptop", max: TOTAL_PORTATILES_POR_CARRO, ubicacion: "Planta Baja" },
      AULA_INF2: { id: "aula_inf2", nombre: "Aula Informática 2", tipo: "aula", max: 1, ubicacion: "Planta 1" },
      AULA_A03: { id: "aula_a03", nombre: "Aula A.0.3", tipo: "aula", max: 1, ubicacion: "Planta Baja" }, 
      NORMATIVA: { id: "normativa", nombre: "Uso por Normativa (Fijo)", tipo: "normativa", max: 999, ubicacion: "Aula propia/Taller" }
    };

    const NIVELES = ["1º ESO", "2º ESO", "3º ESO", "4º ESO", "Bachillerato/Otros"];

    const DEMO_USERS = [
      { email: "ana.sanchez" + DOMAIN, nombre: "Ana Sánchez (Tecnología)", rol: "docente", contrasenia: "tecnologia2026" },
      { email: "carlos.gomez" + DOMAIN, nombre: "Carlos Gómez (Matemáticas)", rol: "docente", contrasenia: "mates2026" },
      { email: "marta.aragon" + DOMAIN, nombre: "Marta de la Fuente (Admin/TIC)", rol: "admin", contrasenia: "admin2026" }
    ];

    const RESERVAS_INICIALES = [
      {
        id: "res-1",
        fecha: "2026-09-07",
        periodoId: 1,
        recursoId: "carro_1",
        cantidad: 15,
        materia: "Taller de Robótica",
        nivel: "3º ESO",
        grupo: "A",
        docenteEmail: "ana.sanchez@iesfrancesdearanda.es",
        docenteNombre: "Ana Sánchez (Tecnología)",
        creadoEn: "2026-09-05T09:00:00.000Z"
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [reservas, setReservas] = useState(RESERVAS_INICIALES);

      useEffect(() => {
        const saved = localStorage.getItem('ies_reservas_v1');
        if (saved) setReservas(JSON.parse(saved));
      }, []);

      const handleLogin = (user) => {
        setCurrentUser(user);
      };

      const handleLogout = () => {
        setCurrentUser(null);
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-indigo-900 text-white p-4 shadow-lg flex justify-between items-center">
            <h1 className="text-xl font-bold flex items-center gap-2">
              💻 RESERVA DE RECURSOS DIGITALES - IES FRANCÉS DE ARANDA
            </h1>
            {currentUser && (
              <div className="flex items-center gap-4">
                <span className="text-sm font-medium">{currentUser.nombre}</span>
                <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold">
                  Salir
                </button>
              </div>
            )}
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto p-6">
            {!currentUser ? (
              <div className="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200 mt-10">
                <h2 className="text-xl font-bold text-center text-slate-800 mb-2">Acceso Docentes (SSO)</h2>
                <p className="text-xs text-center text-slate-500 mb-6">Selecciona un usuario de prueba para acceder:</p>
                
                <div className="space-y-3">
                  {DEMO_USERS.map((u) => (
                    <button
                      key={u.email}
                      onClick={() => handleLogin(u)}
                      className="w-full text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 transition-all"
                    >
                      <p className="font-bold text-sm text-slate-800">{u.nombre}</p>
                      <p className="text-xs text-slate-500 font-mono">{u.email}</p>
                      <span className="inline-block mt-1 text-[10px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-semibold uppercase">
                        Rol: {u.rol}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">Panel de Reservas del Centro</h2>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="border-b bg-slate-100">
                          <th className="p-3">Materia</th>
                          <th className="p-3">Nivel / Grupo</th>
                          <th className="p-3">Recurso</th>
                          <th className="p-3">Docente</th>
                        </tr>
                      </thead>
                      <tbody>
                        {reservas.map((r) => (
                          <tr key={r.id} className="border-b hover:bg-slate-50">
                            <td className="p-3 font-semibold">{r.materia}</td>
                            <td className="p-3">{r.nivel} - {r.grupo}</td>
                            <td className="p-3">{RECURSOS[r.recursoId.toUpperCase()]?.nombre || r.recursoId}</td>
                            <td className="p-3">{r.docenteNombre}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
