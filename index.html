    const formatearFechaBonita = (fechaStr) => {
      if (!fechaStr) return "";
      const parts = fechaStr.split('-');
      if (parts.length !== 3) return fechaStr;
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return date.toLocaleDateString('es-ES', opciones);

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginName, setLoginName] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginRole, setLoginRole] = useState("docente");
      const [showPassword, setShowPassword] = useState(false);
      const [loginError, setLoginError] = useState("");

      const [fechaSeleccionada, setFechaSeleccionada] = useState("2026-09-07"); 
      const [reservas, setReservas] = useState(RESERVAS_INICIALES);
      
      const [viewYear, setViewYear] = useState(2026);
      const [viewMonth, setViewMonth] = useState(8); 

      const [showReservaModal, setShowReservaModal] = useState(false);
      const [editingReservaId, setEditingReservaId] = useState(null); 
      const [modalPeriodo, setModalPeriodo] = useState(null);
      const [modalRecurso, setModalRecurso] = useState(null);
      const [modalMateria, setModalMateria] = useState("");
      const [modalNivel, setModalNivel] = useState("1º ESO");
      const [modalGrupo, setModalGrupo] = useState("A");
      const [modalCantidad, setModalCantidad] = useState(1);
      const [modalEsNormativa, setModalEsNormativa] = useState(false);
      const [modalError, setModalError] = useState("");

      const [currentTab, setCurrentTab] = useState("calendar"); 
      const [filtroRecurso, setFiltroRecurso] = useState("all");
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        const savedReservas = localStorage.getItem('ies_reservas_recursos_v4_update');
        if (savedReservas) {
          setReservas(JSON.parse(savedReservas));
        }
      }, []);

      useEffect(() => {
        const d = new Date(fechaSeleccionada);
        setViewYear(d.getFullYear());
        setViewMonth(d.getMonth());
      }, [fechaSeleccionada]);

      const saveReservasData = (nuevasReservas) => {
        setReservas(nuevasReservas);
        localStorage.setItem('ies_reservas_recursos_v4_update', JSON.stringify(nuevasReservas));
      };

      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => {
          setToastMessage(null);
        }, 4000);
      };

      const handleDemoClick = (user) => {
        setLoginEmail(user.email.replace(DOMAIN, ""));
        setLoginName(user.nombre);
        setLoginRole(user.rol);
        setLoginPassword(user.contrasenia);
        showToast(`Datos de ${user.nombre} listos. Pulsa 'Entrar SSO' para validar.`);
      };

      const handleCustomLogin = (e) => {
        e.preventDefault();
        if (!loginEmail.trim()) {
          setLoginError("Introduce tu correo corporativo.");
          return;
        }
        if (!loginPassword.trim()) {
          setLoginError("Por favor, introduce tu contraseña corporativa.");
          return;
        }
        if (loginPassword.length < 5) {
          setLoginError("La contraseña debe tener al menos 5 caracteres.");
          return;
        }
        
        let emailCompleto = loginEmail.trim().toLowerCase();
        if (!emailCompleto.endsWith(DOMAIN)) {
          emailCompleto += DOMAIN;
        }

        const nombreGenerado = loginName.trim() || emailCompleto.split('@')[0].split('.').map(n => n.charAt(0).toUpperCase() + n.slice(1)).join(' ');

        const newUser = {
          email: emailCompleto,
          nombre: nombreGenerado,
          rol: loginRole
        };

        setCurrentUser(newUser);
        showToast(`Sesión iniciada correctamente como ${nombreGenerado}`);
        setLoginError("");
        setLoginPassword("");
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCurrentTab("calendar");
        showToast("Sesión cerrada correctamente.");
      };

      const cambiarDia = (offset) => {
        const dateObj = new Date(fechaSeleccionada);
        dateObj.setDate(dateObj.getDate() + offset);
        
        const diaSemana = dateObj.getDay();
        if (diaSemana === 0) { 
          dateObj.setDate(dateObj.getDate() + (offset > 0 ? 1 : -2));
        } else if (diaSemana === 6) { 
          dateObj.setDate(dateObj.getDate() + (offset > 0 ? 2 : -1));
        }

        const anio = dateObj.getFullYear();
        const mes = dateObj.getMonth();
        const esCursoValido = (anio === 2026 && mes >= 8) || (anio === 2027 && mes <= 5);
        
        if (esCursoValido) {
          setFechaSeleccionada(dateObj.toISOString().split('T')[0]);
        } else {
          showToast("La navegación está configurada para el curso 2026-2027 (Sept-Jun).");
        }
      };

      const seleccionarDiaCalendario = (dia) => {
        const mesStr = String(viewMonth + 1).padStart(2, '0');
        const diaStr = String(dia).padStart(2, '0');
        const nuevaFecha = `${viewYear}-${mesStr}-${diaStr}`;
        
        const d = new Date(nuevaFecha);
        if (d.getDay() === 0 || d.getDay() === 6) {
          showToast("No se permiten reservas de recursos los fines de semana.");
          return;
        }
        setFechaSeleccionada(nuevaFecha);
        showToast(`Mostrando reservas para el ${formatearFechaBonita(nuevaFecha)}`);
      };

      const cambiarMesCalendario = (offset) => {
        let nuevoMes = viewMonth + offset;
        let nuevoAnio = viewYear;
        if (nuevoMes < 0) {
          nuevoMes = 11;
          nuevoAnio -= 1;
        } else if (nuevoMes > 11) {
          nuevoMes = 0;
          nuevoAnio += 1;
        }

        const esCursoValido = (nuevoAnio === 2026 && nuevoMes >= 8) || (nuevoAnio === 2027 && nuevoMes <= 5);
        if (esCursoValido) {
          setViewMonth(nuevoMes);
          setViewYear(nuevoAnio);
        } else {
          showToast("Navegación del calendario fijada para el curso 2026-2027 (Septiembre - Junio).");
        }
      };

      const datosMesActual = useMemo(() => {
        const primerDiaSemana = new Date(viewYear, viewMonth, 1).getDay(); 
        const desfaseLunes = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;
        const totalDias = new Date(viewYear, viewMonth + 1, 0).getDate();
        
        const celdasVacias = Array(desfaseLunes).fill(null);
        const celdasDias = Array.from({ length: totalDias }, (_, i) => i + 1);
        
        return { celdasVacias, celdasDias };
      }, [viewYear, viewMonth]);

      const fechasDeLaSemana = useMemo(() => {
        const current = new Date(fechaSeleccionada);
        const day = current.getDay();
        const diffToMonday = current.getDate() - day + (day === 0 ? -6 : 1); 
        
        const lunes = new Date(current.setDate(diffToMonday));
        const semana = [];
        
        for (let i = 0; i < 5; i++) {
          const tempDate = new Date(lunes);
          tempDate.setDate(lunes.getDate() + i);
          semana.push(tempDate.toISOString().split('T')[0]);
        }
        return semana;
      }, [fechaSeleccionada]);

      const getPortatilesDisponibles = (fecha, periodoId, recursoId) => {
        const recurso = RECURSOS[recursoId.toUpperCase()] || RECURSOS[recursoId];
        if (!recurso || recurso.tipo !== 'laptop') return 0;

        const reservadoActualmente = reservas
          .filter(r => r.fecha === fecha && r.periodoId === parseInt(periodoId) && r.recursoId === recursoId)
          .filter(r => r.id !== editingReservaId)
          .reduce((sum, r) => sum + r.cantidad, 0);

        return Math.max(0, TOTAL_PORTATILES_POR_CARRO - reservadoActualmente);
      };

      const isAulaReservada = (fecha, periodoId, recursoId) => {
        return reservas.some(r => r.fecha === fecha && r.periodoId === parseInt(periodoId) && r.recursoId === recursoId && r.id !== editingReservaId);
      };

      const getAulaReservaDetalles = (fecha, periodoId, recursoId) => {
        return reservas.find(r => r.fecha === fecha && r.periodoId === parseInt(periodoId) && r.recursoId === recursoId);
      };

      const getCarroReservas = (fecha, periodoId, recursoId) => {
        return reservas.filter(r => r.fecha === fecha && r.periodoId === parseInt(periodoId) && r.recursoId === recursoId);
      };

      const getNormativaReservas = (fecha, periodoId) => {
        return reservas.filter(r => r.fecha === fecha && r.periodoId === parseInt(periodoId) && r.recursoId === "normativa");
      };

      const getReservasParaUnDia = (dia) => {
        const mesStr = String(viewMonth + 1).padStart(2, '0');
        const diaStr = String(dia).padStart(2, '0');
        const fechaEvaluada = `${viewYear}-${mesStr}-${diaStr}`;
        return reservas.filter(r => r.fecha === fechaEvaluada);
      };

      const abrirModalReserva = (periodo, recurso) => {
        setEditingReservaId(null);
        setModalPeriodo(periodo);
        setModalRecurso(recurso);
        setModalMateria("");
        setModalNivel("1º ESO");
        setModalGrupo("A");
        setModalEsNormativa(recurso.tipo === 'normativa');
        
        if (recurso.tipo === 'laptop') {
          const disponibles = getPortatilesDisponibles(fechaSeleccionada, periodo.id, recurso.id);
          setModalCantidad(Math.min(15, disponibles));
        } else {
          setModalCantidad(1);
        }
        setModalError("");
        setShowReservaModal(true);
      };

      const abrirModalEdicion = (reserva) => {
        const recurso = RECURSOS[reserva.recursoId.toUpperCase()] || RECURSOS[reserva.recursoId];
        const periodo = PERIODOS.find(p => p.id === reserva.periodoId);
        
        setEditingReservaId(reserva.id);
        setModalPeriodo(periodo);
        setModalRecurso(recurso);
        setModalMateria(reserva.materia);
        setModalNivel(reserva.nivel);
        setModalGrupo(reserva.grupo);
        setModalCantidad(reserva.cantidad);
        setModalEsNormativa(reserva.esNormativa || recurso?.tipo === 'normativa');
        setModalError("");
        setShowReservaModal(true);
      };

      const handleCrearOEditarReserva = (e) => {
        e.preventDefault();
        setModalError("");

        if (!modalMateria.trim()) {
          setModalError("Por favor, introduce la materia para la justificación pedagógica.");
          return;
        }

        if (modalRecurso.tipo === 'laptop') {
          if (modalCantidad <= 0) {
            setModalError("La cantidad de dispositivos debe ser mayor que cero.");
            return;
          }
          const disponibles = getPortatilesDisponibles(fechaSeleccionada, modalPeriodo.id, modalRecurso.id);
          if (modalCantidad > disponibles) {
            setModalError(`Cupo insuficiente. Solo quedan ${disponibles} disponibles.`);
            return;
          }
        } else if (modalRecurso.tipo === 'aula') {
          if (isAulaReservada(fechaSeleccionada, modalPeriodo.id, modalRecurso.id)) {
            setModalError("Este aula ya se encuentra reservada en el tramo solicitado.");
            return;
          }
        }
        
        if (editingReservaId) {
          const reservasActualizadas = reservas.map(r => {
            if (r.id === editingReservaId) {
              return {
                ...r,
                periodoId: modalPeriodo.id,
                recursoId: modalRecurso.id,
                cantidad: modalRecurso.tipo === 'laptop' ? parseInt(modalCantidad) : 1,
                materia: modalMateria.trim(),
                nivel: modalNivel,
                grupo: modalGrupo.trim().toUpperCase(),
                esNormativa: modalEsNormativa || modalRecurso.tipo === 'normativa',
                editadoEn: new Date().toISOString()
              };
            }
            return r;
          });
          saveReservasData(reservasActualizadas);
          showToast("La reserva ha sido modificada y guardada correctamente.");
        } else {
          const nuevaReserva = {
            id: "res-" + Date.now(),
            fecha: fechaSeleccionada,
            periodoId: modalPeriodo.id,
            recursoId: modalRecurso.id,
            cantidad: modalRecurso.tipo === 'laptop' ? parseInt(modalCantidad) : 1,
            materia: modalMateria.trim(),
            nivel: modalNivel,
            grupo: modalGrupo.trim().toUpperCase(),
            docenteEmail: currentUser.email,
            docenteNombre: currentUser.nombre,
            esNormativa: modalEsNormativa || modalRecurso.tipo === 'normativa',
            creadoEn: new Date().toISOString()
          };
          saveReservasData([...reservas, nuevaReserva]);
          showToast(`¡Reserva confirmada con éxito para ${nuevaReserva.nivel} ${nuevaReserva.grupo}!`);
        }

        setShowReservaModal(false);
        setEditingReservaId(null);
      };

      const eliminarReserva = (id) => {
        const reservaAEliminar = reservas.find(r => r.id === id);
        if (!reservaAEliminar) return;

        if (reservaAEliminar.docenteEmail !== currentUser.email && currentUser.rol !== 'admin') {
          showToast("No tienes autorización para cancelar la reserva de otro compañero.");
          return;
        }

        const confirmacion = window.confirm(`¿Seguro que deseas cancelar la reserva de "${reservaAEliminar.materia}"?`);
        if (confirmacion) {
          const filtradas = reservas.filter(r => r.id !== id);
          saveReservasData(filtradas);
          showToast("Reserva cancelada de manera inmediata.");
        }
      };

      const reservasUsuarioLogueado = useMemo(() => {
        if (!currentUser) return [];
        return reservas.filter(r => r.docenteEmail === currentUser.email)
          .sort((a, b) => b.fecha.localeCompare(a.fecha) || a.periodoId - b.periodoId);

                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-50 text-slate-500 text-xs font-bold uppercase border-b border-slate-200">
                              <th className="p-2.5">Fecha</th>
                              <th className="p-2.5">Tramo Horario</th>
                              <th className="p-2.5">Recurso</th>
                              <th className="p-2.5">Materia</th>
                              <th className="p-2.5">Grupo</th>
                              <th className="p-2.5 text-center">Unidades</th>
                              <th className="p-2.5 text-right">Acciones</th>
                            </tr>
                          </thead>
                          <tbody>
                            {reservasUsuarioLogueado.map((res) => {
                              const rec = RECURSOS[res.recursoId.toUpperCase()] || RECURSOS[res.recursoId];
                              const per = PERIODOS.find(p => p.id === res.periodoId);
                              return (
                                <tr key={res.id} className="hover:bg-slate-50/50 border-b border-slate-100 text-xs">
                                  <td className="p-2.5 font-bold text-slate-900 font-mono">
                                    {res.fecha}
                                  </td>
                                  <td className="p-2.5">
                                    <span className="font-semibold">{per?.nombre}</span> <span className="text-slate-400 font-mono">({per?.rango})</span>
                                  </td>
                                  <td className="p-2.5 font-semibold text-slate-750">
                                    {res.esNormativa || res.recursoId === 'normativa' ? (
                                      <span className="bg-purple-100 text-purple-800 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 w-fit">
                                        <Bookmark className="h-3 w-3" /> Fijo Normativa
                                      </span>
                                    ) : rec?.tipo === 'laptop' ? (
                                      <span className="flex items-center gap-1"><Laptop className="h-4 w-4 text-indigo-500" /> {rec?.nombre}</span>
                                    ) : (
                                      <span className="flex items-center gap-1"><Monitor className="h-4 w-4 text-amber-500" /> {rec?.nombre}</span>
                                    )}
                                  </td>
                                  <td className="p-2.5 text-slate-950 font-bold">{res.materia}</td>
                                  <td className="p-2.5">
                                    <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold">
                                      {res.nivel} {res.grupo}
                                    </span>
                                  </td>
                                  <td className="p-2.5 text-center font-bold">
                                    {res.esNormativa || res.recursoId === 'normativa' ? "Fijo" : res.cantidad}
                                  </td>
                                  <td className="p-2.5 text-right space-x-1.5">
                                    <button
                                      onClick={() => abrirModalEdicion(res)}
                                      className="p-1 text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 rounded"
                                      title="Editar"
                                    >
                                      <Edit3 className="h-4.5 w-4.5" />
                                    </button>
                                    <button
                                      onClick={() => eliminarReserva(res.id)}
                                      className="p-1 text-red-600 hover:text-red-800 hover:bg-red-50 rounded"
                                      title="Eliminar"
                                    >
                                      <Trash2 className="h-4.5 w-4.5" />
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}

                  </div>
                )}

                {/* TAB 4: ESTADÍSTICAS */}
                {currentTab === "admin" && currentUser.rol === 'admin' && (
                  <div className="space-y-6">
                    
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">Total Reservas</span>
                        <p className="text-2xl font-black text-indigo-900 mt-1">{stats.totalReservasCount}</p>
                      </div>
                      
                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">Portátiles Solicitados</span>
                        <p className="text-2xl font-black text-emerald-600 mt-1">{stats.totalPortatilesReservados}</p>
                      </div>

                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">Uso de Aulas</span>
                        <p className="text-2xl font-black text-amber-500 mt-1">{stats.totalAulasCount}</p>
                      </div>

                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">Fijos de Normativa</span>
                        <p className="text-2xl font-black text-purple-600 mt-1">{stats.totalNormativaCount}</p>
                      </div>

                      <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">Acreditación SSO</span>
                        <p className="text-2xl font-black text-slate-800 mt-1">Activo</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      
                      <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <h3 className="text-xs font-bold text-slate-900 uppercase tracking-wide">Distribución por recurso</h3>
                        <div className="space-y-3">
                          {Object.values(RECURSOS).map(rec => {
                            const count = stats.usoPorRecurso[rec.id] || 0;
                            const porcentaje = stats.totalReservasCount > 0 ? (count / stats.totalReservasCount) * 100 : 0;
                            return (
                              <div key={rec.id} className="space-y-1">
                                <div className="flex justify-between text-xs font-bold text-slate-700">
                                  <span>{rec.nombre}</span>
                                  <span>{count} sesiones ({porcentaje.toFixed(0)}%)</span>
                                </div>
                                <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                  <div 
                                    className="h-full bg-indigo-600 rounded-full"
                                    style={{ width: `${porcentaje}%` }}
                                  ></div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <h3 className="text-xs font-bold text-slate-900 uppercase tracking-wide">Top 5 docentes activos</h3>
                        {stats.rankingSorted.length === 0 ? (
                          <p className="text-xs text-slate-400 py-6 text-center">Sin datos registrados.</p>
                        ) : (
                          <div className="space-y-1.5">
                            {stats.rankingSorted.map(([nombre, count], idx) => (
                              <div key={nombre} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                                <div className="flex items-center space-x-2">
                                  <span className="font-bold text-slate-450">#{idx + 1}</span>
                                  <span className="font-bold text-slate-800">{nombre}</span>
                                </div>
                                <span className="bg-indigo-100 text-indigo-800 font-bold px-2.5 py-0.5 rounded-lg">
                                  {count} reservas
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                    </div>

                    {/* LOG COMPLETO */}
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                      <div className="flex flex-wrap justify-between items-center gap-3">
                        <div>
                          <h3 className="text-sm font-bold text-slate-900">Histórico General de Reservas (Administrador)</h3>
                          <p className="text-xs text-slate-500">Control interno e histórico para auditorías de equidad escolar.</p>
                        </div>
                        <button 
                          onClick={() => {
                            const headers = "Fecha,Periodo,Recurso,Cantidad,Materia,Nivel,Grupo,EsNormativa,DocenteEmail\n";
                            const rows = reservas.map(r => `${r.fecha},${r.periodoId},${r.recursoId},${r.cantidad},"${r.materia}","${r.nivel}","${r.grupo}",${r.esNormativa || r.recursoId === 'normativa'},${r.docenteEmail}`).join("\n");
                            const blob = new Blob([headers + rows], { type: 'text/csv' });
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.setAttribute('href', url);
                            a.setAttribute('download', `reservas-recursos-digitales.csv`);
                            a.click();
                          }}
                          className="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1 shadow-sm"
                        >
                          <Download className="h-3.5 w-3.5" /> Exportar CSV
                        </button>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse font-medium">
                          <thead>
                            <tr className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                              <th className="p-2.5">Docente</th>
                              <th className="p-2.5">Fecha / Tramo</th>
                              <th className="p-2.5">Recurso / Modalidad</th>
                              <th className="p-2.5">Materia (Nivel Grupo)</th>
                              <th className="p-2.5 text-center">Unidades</th>
                              <th className="p-2.5 text-right">Acción</th>
                            </tr>
                          </thead>
                          <tbody>
                            {reservas.map(r => {
                              const rec = RECURSOS[r.recursoId.toUpperCase()] || RECURSOS[r.recursoId];
                              const per = PERIODOS.find(p => p.id === r.periodoId);
                              return (
                                <tr key={r.id} className="border-b border-slate-100 hover:bg-slate-50/50">
                                  <td className="p-2.5">
                                    <p className="font-bold text-slate-950">{r.docenteNombre}</p>
                                    <p className="text-[9px] text-slate-400">{r.docenteEmail}</p>
                                  </td>
                                  <td className="p-2.5 font-mono font-bold text-[11px]">
                                    {r.fecha} <span className="text-slate-400">({per?.nombre})</span>
                                  </td>
                                  <td className="p-2.5 font-bold">
                                    {r.esNormativa || r.recursoId === 'normativa' ? (
                                      <span className="bg-purple-100 text-purple-800 text-[9px] px-1.5 py-0.5 rounded-full">Fijo Normativa</span>
                                    ) : (
                                      <span className="text-indigo-950 text-[11px]">{rec?.nombre}</span>
                                    )}
                                  </td>
                                  <td className="p-2.5">
                                    <strong>{r.materia}</strong> 
                                    <span className="ml-1.5 bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold text-[9px]">
                                      {r.nivel} {r.grupo}
                                    </span>
                                  </td>
                                  <td className="p-2.5 text-center font-bold">
                                    {r.esNormativa || r.recursoId === 'normativa' ? "Fijo" : r.cantidad}
                                  </td>
                                  <td className="p-2.5 text-right space-x-1.5">
                                    <button
                                      onClick={() => abrirModalEdicion(r)}
                                      className="text-indigo-600 hover:text-indigo-800 font-bold"
                                    >
                                      Editar
                                    </button>
                                    <button
                                      onClick={() => {
                                        const confirmacion = window.confirm(`Vas a eliminar esta reserva. ¿Proceder?`);
                                        if (confirmacion) {
                                          saveReservasData(reservas.filter(item => item.id !== r.id));
                                          showToast("Reserva eliminada por el administrador.");
                                        }
                                      }}
                                      className="text-red-500 hover:text-red-700 font-bold"
                                    >
                                      Borrar
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>

                    </div>

                  </div>
                )}

                {/* TAB 5: NORMATIVA REGULADORA */}
                {currentTab === "regulations" && (
                  <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                    <div className="border-b border-slate-100 pb-3">
                      <h2 className="text-lg font-bold text-indigo-950 flex items-center gap-2">
                        <FileText className="h-5 w-5 text-indigo-600" />
                        Regulación de Recursos Digitales - Aragón (ECD/465/2026)
                      </h2>
                      <p className="text-xs text-slate-500 mt-1">Garantías jurídicas y de distribución equitativa para centros públicos.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs text-slate-750">
                      <div className="space-y-4">
                        <h3 className="font-bold text-slate-900 flex items-center gap-1 text-sm">
                          <CheckCircle className="h-4 w-4 text-emerald-500" />
                          Puntos Clave del Decreto
                        </h3>
                        
                        <div className="p-4 bg-slate-50 rounded-2xl space-y-1.5 border border-slate-100">
                          <p className="font-bold text-slate-800 text-[10px] uppercase tracking-wider text-indigo-700">1. Vinculación Pedagógica Obligatoria</p>
                          <p className="leading-relaxed">
                            Queda prohibido reservar carros de ordenadores o aulas libres sin vincularlos a un grupo concreto y a un desarrollo curricular explícito. Por ello, la aplicación obliga a rellenar los campos "Materia" y "Nivel/Grupo".
                          </p>
                        </div>

                        <div className="p-4 bg-slate-50 rounded-2xl space-y-1.5 border border-slate-100">
                          <p className="font-bold text-slate-800 text-[10px] uppercase tracking-wider text-indigo-700">2. Reparto de Recursos e Inventario</p>
                          <p className="leading-relaxed">
                            Los centros públicos deben posibilitar el uso simultáneo compartido. El sistema informático de reserva fracciona los carros por unidades en lugar de bloquear el carro completo, optimizando el uso eficiente.
                          </p>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h3 className="font-bold text-slate-900 flex items-center gap-1 text-sm">
                          <AlertTriangle className="h-4 w-4 text-amber-500" />
                          Responsabilidad y Buenas Prácticas
                        </h3>

                        <div className="p-4 bg-indigo-50/50 rounded-2xl space-y-2 border border-indigo-100">
                          <p className="font-bold text-slate-900">Para garantizar la equidad de uso de los carros de portátiles:</p>
                          <ul className="list-disc pl-5 space-y-1.5 text-indigo-950">
                            <li>Devuelve el carro a su planta correspondiente inmediatamente al finalizar el periodo reservado.</li>
                            <li>Asegúrate de dejar los dispositivos <strong>enchufados a la corriente</strong> dentro del carro para que se carguen para el siguiente compañero.</li>
                            <li>Notifica cualquier avería física o de software al coordinador TIC para que lo registre a la mayor brevedad.</li>
                          </ul>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-3 rounded-2xl text-center border border-slate-200">
                      <p className="text-[10px] text-slate-500">
                        Aplicación interna autorizada e implementada de acuerdo con el Plan Digital del Centro (IES Francés de Aranda).
                      </p>
                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* FOOTER DEL CENTRO */}
          <footer className="bg-slate-900 text-slate-400 py-5 px-4 border-t border-slate-800 text-center text-[10px] mt-12">
            <div className="max-w-7xl mx-auto space-y-1">
              <p>© 2026-2027 IES Francés de Aranda. Todos los derechos reservados.</p>
              <p className="text-slate-500">
                Diseñado e implementado siguiendo pautas de usabilidad extrema y normativa de Gobierno de Aragón. 
                Versión 4.5 (Acreditación por Contraseña, Aula A.0.3 y Calendario de Navegación Rápida Activos).
              </p>
            </div>
          </footer>

          {/* MODAL PARA REALIZAR O EDITAR LA RESERVA */}
          {showReservaModal && modalPeriodo && modalRecurso && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-200">
                
                <div className="bg-gradient-to-br from-indigo-800 to-indigo-900 text-white p-5 relative">
                  <h3 className="text-base font-bold">
                    {editingReservaId ? "Editar Asignación / Reserva" : "Nueva Reserva de Recurso"}
                  </h3>
                  <p className="text-xs text-indigo-200 mt-0.5">Día de asignación: <strong>{fechaSeleccionada}</strong></p>
                </div>

                <form onSubmit={handleCrearOEditarReserva} className="p-5 space-y-3.5">
                  
                  <div className="bg-slate-50 p-3 rounded-2xl flex items-center justify-between border border-slate-200 text-xs">
                    <div className="space-y-0.5">
                      <p className="text-slate-500 font-bold">Recurso seleccionado:</p>
                      <p className="font-bold text-slate-900 flex items-center gap-1 mt-0.5">
                        {modalRecurso.tipo === 'laptop' && <Laptop className="h-3.5 w-3.5 text-indigo-500" />}
                        {modalRecurso.tipo === 'aula' && <Monitor className="h-3.5 w-3.5 text-amber-500" />}
                        {modalRecurso.tipo === 'normativa' && <Bookmark className="h-3.5 w-3.5 text-purple-600" />}
                        {modalRecurso.nombre}
                      </p>
                    </div>
                    <div className="text-right space-y-0.5">
                      <p className="text-slate-500 font-bold">Periodo de clase:</p>
                      <p className="font-bold text-indigo-900 mt-0.5">{modalPeriodo.nombre}</p>
                      <p className="font-mono text-slate-400 text-[9px]">({modalPeriodo.rango})</p>
                    </div>
                  </div>

                  {modalRecurso.tipo !== 'normativa' && (
                    <div className="flex items-center space-x-2 bg-purple-50 p-2.5 rounded-xl border border-purple-100">
                      <input 
                        type="checkbox" 
                        id="esNormativaCheckbox"
                        checked={modalEsNormativa}
                        onChange={(e) => setModalEsNormativa(e.target.checked)}
                        className="h-3.5 w-3.5 text-purple-600 border-purple-300 rounded focus:ring-purple-500"
                      />
                      <label htmlFor="esNormativaCheckbox" className="text-xs font-semibold text-purple-950 cursor-pointer">
                        Marcar como "Materia Fija por Normativa" (Asignación obligatoria)
                      </label>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                        Nivel Educativo:
                      </label>
                      <select
                        value={modalNivel}
                        onChange={(e) => setModalNivel(e.target.value)}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:ring-1 focus:ring-indigo-500"
                      >
                        {NIVELES.map(n => (
                          <option key={n} value={n}>{n}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                        Grupo / Letra:
                      </label>
                      <input 
                        type="text" 
                        required
                        placeholder="Ej: A, B, Bach"
                        value={modalGrupo}
                        onChange={(e) => setModalGrupo(e.target.value)}
                        className="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold uppercase focus:bg-white text-center text-xs"
                      />
                    </div>
                  </div>

                  {modalRecurso.tipo === 'laptop' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1 flex justify-between">
                        <span>Número de Portátiles necesarios:</span>
                        <span className="text-indigo-600 font-extrabold text-xs bg-indigo-50 px-2 py-0.5 rounded-lg">
                          Máx. {getPortatilesDisponibles(fechaSeleccionada, modalPeriodo.id, modalRecurso.id)} libres
                        </span>
                      </label>
                      <input 
                        type="number" 
                        min={1}
                        max={getPortatilesDisponibles(fechaSeleccionada, modalPeriodo.id, modalRecurso.id)}
                        value={modalCantidad}
                        onChange={(e) => setModalCantidad(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-base text-indigo-900 focus:bg-white focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-all"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                      Materia / Justificación: <span className="text-red-500">*</span>
                    </label>
                    <input 
                      type="text" 
                      required
                      placeholder="Ej: Tecnología y Digitalización, Robótica..."
                      value={modalMateria}
                      onChange={(e) => setModalMateria(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-xs transition-all"
                    />
                  </div>

                  {modalError && (
                    <div className="bg-red-50 border border-red-200 text-red-800 p-2.5 rounded-xl text-[11px] font-bold text-center">
                      {modalError}
                    </div>
                  )}

                  <div className="flex space-x-3 pt-1.5">
                    <button
                      type="button"
                      onClick={() => {
                        setShowReservaModal(false);
                        setEditingReservaId(null);
                      }}
                      className="w-1/2 py-2.5 border border-slate-200 hover:bg-slate-50 rounded-xl text-slate-600 font-bold text-xs transition-colors"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg transition-all"
                    >
                      {editingReservaId ? "Guardar Cambios" : "Confirmar Reserva"}
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
