<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva de Recursos Digitales - IES Francés de Aranda</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React y ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel para interpretar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased font-medium">
  
  <div id="root"></div>

  <!-- Importante: usar solo type="text/babel" (sin data-type="module") -->
  <script type="text/babel">
    // 1. Extraemos los hooks directamente de la variable global de React
    const { useState, useEffect, useRef } = React;

    // 2. AQUÍ PEGA EL CÓDIGO DE TU COMPONENTE
    function App() {
      // Ejemplo de estado
      const [mensaje, setMensaje] = useState("¡Sistema de Reserva Cargado Correctamente!");

      return (
        <div class="min-h-screen flex flex-col items-center justify-center p-6">
          <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 text-center max-w-md">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">
              Reserva de Recursos Digitales
            </h1>
            <p class="text-slate-600 mb-4">{mensaje}</p>
            <button 
              onClick={() => alert("¡Funciona!")}
              class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
            >
              Probar interacción
            </button>
          </div>
        </div>
      );
    }

    // 3. Renderizamos la aplicación en el div #root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
