<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Recursos Digitales</title>
    
    <!-- Tailwind CSS CDN para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    <!-- Contenedor principal donde React inyectará la app -->
    <div id="root"></div>

    <!-- Script con tipo babel donde vive todo el código de React -->
    <script type="text/babel">
        // 1. Extraemos los Hooks del objeto global React
        const { useState, useEffect, useMemo } = React;

        // 2. Componentes SVG para los Iconos (Reemplazando lucide-react)
        const Laptop = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>
        );

        const Monitor = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="12" x2="12" y1="17" y2="21"/><line x1="8" x2="16" y1="21" y2="21"/></svg>
        );

        const CalendarIcon = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        );

        const BookOpen = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        );

        const User = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );

        const Shield = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        );

        const Clock = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );

        const Plus = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        );

        const Trash2 = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        );

        const CheckCircle = ({ className = "w-5 h-5" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );

        // 3. Componente Principal de la Aplicación
        function App() {
          // Listado inicial de recursos
          const [recursos] = useState([
            { id: 1, nombre: 'Carrito Portátiles A (15 equipos)', tipo: 'laptop', ubicación: 'Planta 1' },
            { id: 2, nombre: 'Carrito Portátiles B (15 equipos)', tipo: 'laptop', ubicación: 'Planta 2' },
            { id: 3, nombre: 'Proyector + Altavoces Portátil', tipo: 'monitor', ubicación: 'Conserjería' },
            { id: 4, nombre: 'Aula de Informática 1', tipo: 'aula', ubicación: 'Edificio Principal' },
            { id: 5, nombre: 'Kits de Robótica (x10)', tipo: 'book', ubicación: 'Dpto. Tecnología' },
          ]);

          // Listado inicial de reservas
          const [reservas, setReservas] = useState([
            {
              id: 'RES-001',
              recursoId: 1,
              usuario: 'Prof. Ana García',
              fecha: new Date().toISOString().split('T')[0],
              horario: '09:00 - 10:00',
              motivo: 'Taller de programación con 2º ESO',
            }
          ]);

          // Estados del formulario
          const [recursoSeleccionado, setRecursoSeleccionado] = useState(1);
          const [nombreUsuario, setNombreUsuario] = useState('');
          const [fechaReserva, setFechaReserva] = useState(new Date().toISOString().split('T')[0]);
          const [horario, setHorario] = useState('08:00 - 09:00');
          const [motivo, setMotivo] = useState('');
          const [mensajeExito, setMensajeExito] = useState(false);
          const [filtroCategoria, setFiltroCategoria] = useState('todos');
          const [esModoAdmin, setEsModoAdmin] = useState(false);

          // Filtrar recursos
          const recursosFiltrados = useMemo(() => {
            if (filtroCategoria === 'todos') return recursos;
            return recursos.filter(r => r.tipo === filtroCategoria);
          }, [recursos, filtroCategoria]);

          // Crear nueva reserva
          const handleSubmit = (e) => {
            e.preventDefault();
            if (!nombreUsuario.trim() || !fechaReserva || !motivo.trim()) return;

            const nuevaReserva = {
              id: `RES-${Date.now().toString().slice(-4)}`,
              recursoId: parseInt(recursoSeleccionado),
              usuario: nombreUsuario,
              fecha: fechaReserva,
              horario: horario,
              motivo: motivo,
            };

            setReservas([nuevaReserva, ...reservas]);
            setNombreUsuario('');
            setMotivo('');
            setMensajeExito(true);

            setTimeout(() => setMensajeExito(false), 4000);
          };

          // Cancelar reserva
          const handleEliminarReserva = (id) => {
            setReservas(reservas.filter(r => r.id !== id));
          };

          const obtenerIconoRecurso = (tipo) => {
            switch(tipo) {
              case 'laptop': return <Laptop className="w-5 h-5 text-indigo-600" />;
              case 'monitor': return <Monitor className="w-5 h-5 text-emerald-600" />;
              case 'aula': return <BookOpen className="w-5 h-5 text-amber-600" />;
              default: return <BookOpen className="w-5 h-5 text-blue-600" />;
            }
          };

          return (
            <div className="min-h-screen bg-slate-100 pb-12">
              {/* Encabezado */}
              <header className="bg-indigo-700 text-white shadow-md mb-8">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center space-x-3">
                    <div className="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                      <Laptop className="w-8 h-8 text-white" />
                    </div>
                    <div>
                      <h1 className="text-2xl font-bold tracking-tight">Gestión de Recursos Digitales</h1>
                      <p className="text-indigo-200 text-sm">Sistema de reservas e inventario del centro</p>
                    </div>
                  </div>

                  <button 
                    onClick={() => setEsModoAdmin(!esModoAdmin)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                      esModoAdmin 
                        ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-sm' 
                        : 'bg-indigo-800 hover:bg-indigo-900 text-indigo-100'
                    }`}
                  >
                    {esModoAdmin ? <Shield className="w-4 h-4" /> : <User className="w-4 h-4" />}
                    {esModoAdmin ? 'Vista Administrador' : 'Vista Usuario'}
                  </button>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* Columna Izquierda: Formulario & Catálogo */}
                <div className="lg:col-span-5 space-y-6">
                  {/* Formulario */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div className="flex items-center gap-2 mb-6 border-b border-slate-100 pb-4">
                      <Plus className="w-5 h-5 text-indigo-600" />
                      <h2 className="text-lg font-semibold text-slate-800">Nueva Reserva</h2>
                    </div>

                    {mensajeExito && (
                      <div className="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center gap-3 text-emerald-800 text-sm">
                        <CheckCircle className="w-5 h-5 text-emerald-600 shrink-0" />
                        <span>¡Reserva registrada correctamente!</span>
                      </div>
                    )}

                    <form onSubmit={handleSubmit} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Seleccionar Recurso</label>
                        <select
                          value={recursoSeleccionado}
                          onChange={(e) => setRecursoSeleccionado(e.target.value)}
                          className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                        >
                          {recursos.map(r => (
                            <option key={r.id} value={r.id}>
                              {r.nombre} ({r.ubicación})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Profesor / Solicitante</label>
                        <input
                          type="text"
                          required
                          placeholder="Ej: Prof. María López"
                          value={nombreUsuario}
                          onChange={(e) => setNombreUsuario(e.target.value)}
                          className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
                          <input
                            type="date"
                            required
                            value={fechaReserva}
                            onChange={(e) => setFechaReserva(e.target.value)}
                            className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Horario</label>
                          <select
                            value={horario}
                            onChange={(e) => setHorario(e.target.value)}
                            className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                          >
                            <option value="08:00 - 09:00">08:00 - 09:00 (1ª Hora)</option>
                            <option value="09:00 - 10:00">09:00 - 10:00 (2ª Hora)</option>
                            <option value="10:00 - 11:00">10:00 - 11:00 (3ª Hora)</option>
                            <option value="11:30 - 12:30">11:30 - 12:30 (4ª Hora)</option>
                            <option value="12:30 - 13:30">12:30 - 13:30 (5ª Hora)</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Motivo / Grupo</label>
                        <textarea
                          required
                          rows="3"
                          placeholder="Ej: Uso de software interactivo con 1º Bachillerato"
                          value={motivo}
                          onChange={(e) => setMotivo(e.target.value)}
                          className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 text-sm"
                      >
                        <CalendarIcon className="w-4 h-4" />
                        Confirmar Reserva
                      </button>
                    </form>
                  </div>

                  {/* Catálogo Rápido */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-semibold text-slate-800 text-sm">Inventario de Recursos</h3>
                      <div className="flex gap-1 text-xs">
                        <button 
                          onClick={() => setFiltroCategoria('todos')}
                          className={`px-2 py-1 rounded ${filtroCategoria === 'todos' ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'text-slate-500 hover:bg-slate-100'}`}
                        >
                          Todos
                        </button>
                        <button 
                          onClick={() => setFiltroCategoria('laptop')}
                          className={`px-2 py-1 rounded ${filtroCategoria === 'laptop' ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'text-slate-500 hover:bg-slate-100'}`}
                        >
                          Laptops
                        </button>
                      </div>
                    </div>

                    <div className="space-y-3">
                      {recursosFiltrados.map(r => (
                        <div key={r.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-slate-50/50">
                          <div className="p-2 bg-white rounded-lg border border-slate-100">
                            {obtenerIconoRecurso(r.tipo)}
                          </div>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-medium text-slate-800 truncate">{r.nombre}</p>
                            <p className="text-xs text-slate-500">{r.ubicación}</p>
                          </div>
                          <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800">
                            Disponible
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Columna Derecha: Listado de Reservas */}
                <div className="lg:col-span-7 space-y-6">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                      <div className="flex items-center gap-2">
                        <CalendarIcon className="w-5 h-5 text-indigo-600" />
                        <h2 className="text-lg font-semibold text-slate-800">Reservas Agendadas</h2>
                      </div>
                      <span className="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full">
                        {reservas.length} {reservas.length === 1 ? 'reserva' : 'reservas'}
                      </span>
                    </div>

                    {reservas.length === 0 ? (
                      <div className="text-center py-12 text-slate-400">
                        <CalendarIcon className="w-12 h-12 mx-auto mb-3 opacity-40" />
                        <p className="text-base font-medium text-slate-600">No hay reservas vigentes</p>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        {reservas.map((r) => {
                          const recurso = recursos.find(item => item.id === r.recursoId);
                          return (
                            <div 
                              key={r.id} 
                              className="p-4 rounded-xl border border-slate-200 bg-white shadow-xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
                            >
                              <div className="space-y-1">
                                <div className="flex items-center gap-2">
                                  <span className="font-semibold text-slate-900 text-sm">
                                    {recurso ? recurso.nombre : 'Recurso'}
                                  </span>
                                  <span className="text-xs text-slate-400 font-mono">#{r.id}</span>
                                </div>
                                
                                <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-600">
                                  <span className="flex items-center gap-1">
                                    <User className="w-3.5 h-3.5 text-slate-400" />
                                    {r.usuario}
                                  </span>
                                  <span className="flex items-center gap-1">
                                    <CalendarIcon className="w-3.5 h-3.5 text-slate-400" />
                                    {r.fecha}
                                  </span>
                                  <span className="flex items-center gap-1">
                                    <Clock className="w-3.5 h-3.5 text-slate-400" />
                                    {r.horario}
                                  </span>
                                </div>

                                <p className="text-xs text-slate-500 italic mt-1 bg-slate-50 p-2 rounded-md border border-slate-100">
                                  "{r.motivo}"
                                </p>
                              </div>

                              <button
                                onClick={() => handleEliminarReserva(r.id)}
                                title="Cancelar reserva"
                                className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors shrink-0"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

              </main>
            </div>
          );
        }

        // 4. Renderizar el componente principal en el DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
